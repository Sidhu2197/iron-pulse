<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="IronPulse app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>IronPulse</title>
  <defs>
    <linearGradient id="bg" x1="0.21" y1="0.09" x2="0.79" y2="0.91">
      <stop offset="0" stop-color="#131C2E"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="plates" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="114" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="170" height="170" rx="40" ry="40" fill="url(#bg)"/>

  <!-- Mark: barbell plates + heartbeat line (120x120 design grid, scaled to 112 px, centred) -->
  <g transform="translate(29 29) scale(0.933333)">
    <rect x="6"   y="34" width="10" height="52" rx="4" fill="url(#plates)"/>
    <rect x="19"  y="24" width="12" height="72" rx="4" fill="url(#plates)"/>
    <rect x="89"  y="24" width="12" height="72" rx="4" fill="url(#plates)"/>
    <rect x="104" y="34" width="10" height="52" rx="4" fill="url(#plates)"/>
    <path d="M31 60 H45 L51 50 L57 66 L64 28 L72 84 L77 60 H89"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
