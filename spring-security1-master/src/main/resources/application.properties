spring.datasource.url=jdbc:mysql://localhost:3306/yourdb
spring.datasource.username=root
spring.datasource.password=Adhi@8897

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

# ML Service Configuration
ml.service.url=https://calories-predictor-1-jttt.onrender.com
ml.service.timeout.connect=5000
ml.service.timeout.read=30000

# Diet Recommendation ML Model
diet.ml.service.url=https://diet-recommendation-model.onrender.com

# ===== Redis Cache =====
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ===== Actuator / Cache Metrics =====
management.endpoints.web.exposure.include=health,metrics,caches
management.endpoint.health.show-details=when-authorized
management.metrics.cache.instrument-cache=true

# ===== Gmail SMTP (Forgot Password) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL for password reset links
app.frontend.url=http://localhost:5173
