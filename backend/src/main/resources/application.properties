# Loads backend/.env locally when present. Render supplies these as environment variables.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

# JWT signing key. Generate a strong value and provide it as JWT_SECRET before deployment.
jwt.secret=${JWT_SECRET:}

# HttpOnly authentication cookies.
auth.cookie.secure=true
auth.cookie.same-site=None

# ML Service Configuration
ml.service.url=https://calories-predictor-1-jttt.onrender.com
ml.service.timeout.connect=5000
ml.service.timeout.read=30000

# Diet Recommendation ML Model
diet.ml.service.url=https://diet-recommendation-model.onrender.com

# ===== Redis Cache =====
spring.cache.type=redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ===== Gmail SMTP  =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL for email links and browser origins permitted to call the API.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
